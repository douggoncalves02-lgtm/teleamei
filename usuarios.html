<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Usuários - TeleAmei</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">

    <!-- BARRA DE NAVEGAÇÃO -->
    <div class="max-w-4xl mx-auto flex justify-between items-center mb-6 bg-indigo-900 text-white p-4 rounded-lg shadow">
        <div class="font-bold text-lg">TeleAmei 💙 | Gestão de Usuários</div>
        <div class="flex items-center space-x-3">
            <span class="text-sm">Admin: <strong id="usuarioLogadoNome">Carregando...</strong></span>
            <button onclick="window.location.href='dashboard.html'" class="bg-purple-600 hover:bg-purple-700 px-3 py-1 rounded text-sm font-bold shadow transition">📊 BI</button>
            <button onclick="window.location.href='crm_operacoes.html'" class="bg-indigo-500 hover:bg-indigo-600 px-3 py-1 rounded text-sm font-bold shadow transition">Voltar</button>
            <button onclick="fazerLogout()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm font-bold shadow transition">Sair</button>
        </div>
    </div>
    
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-lg border-t-4 border-indigo-800">
        <h1 class="text-2xl font-bold text-indigo-800 mb-6">Cadastrar Novo Colaborador</h1>

        <form id="formUsuario" class="space-y-6">
            <!-- Dados Básicos -->
            <div class="grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg border border-gray-200">
                <div class="col-span-2"><label class="block text-sm font-medium text-gray-700">Nome Completo</label><input type="text" id="nome" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md"></div>
                <div><label class="block text-sm font-medium text-gray-700">Telefone / WhatsApp</label><input type="tel" id="telefone" placeholder="(11) 99999-9999" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md"></div>
                <div><label class="block text-sm font-medium text-gray-700">E-mail (Login)</label><input type="email" id="email" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md"></div>
                <div><label class="block text-sm font-medium text-gray-700">Senha Provisória</label><input type="password" id="senha" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md"></div>
                
                <div class="mt-4 col-span-2 md:col-span-1">
                    <label class="block text-sm font-medium text-indigo-900 mb-2">Perfil de Acesso</label>
                    <select id="perfil" onchange="alternarCampos()" class="w-full border-2 border-indigo-300 p-2 rounded font-bold bg-white">
                        <option value="">Selecione o Nível...</option>
                        <option value="Admin">Administrativo (Acesso Total)</option>
                        <option value="Medico">Médico (Corpo Clínico)</option>
                        <option value="Usuario">Operação (Recepção/Gestão)</option>
                    </select>
                </div>
            </div>

            <!-- Módulo Médico -->
            <div id="camposMedico" class="hidden bg-blue-50 p-4 rounded-lg border border-blue-200">
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div><label class="block text-sm font-medium text-blue-900">CRM</label><input type="text" id="crm" class="mt-1 block w-full px-4 py-2 border border-blue-300 rounded-md"></div>
                    <div>
                        <label class="block text-sm font-medium text-blue-900">Especialidades (Segure Ctrl para várias)</label>
                        <select id="especialidades" multiple class="mt-1 block w-full px-4 py-2 border border-blue-300 rounded-md h-24 bg-white">
                            <option value="Cardiologia">Cardiologia</option>
                            <option value="Pediatria">Pediatria</option>
                            <option value="Clínico Geral">Clínico Geral</option>
                            <option value="Dermatologia">Dermatologia</option>
                            <option value="Psicologia">Psicologia</option>
                        </select>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-blue-900">Foto de Perfil (Opcional)</label>
                    <input type="file" id="fotoMedico" accept="image/*" class="mt-1 block w-full bg-white p-2 border border-blue-200 rounded cursor-pointer">
                </div>
                <div><label class="block text-sm font-medium text-blue-900">Apresentação Profissional</label><textarea id="apresentacao" class="mt-1 block w-full px-4 py-2 border border-blue-300 rounded-md h-20"></textarea></div>
            </div>

            <!-- Módulo Usuário/Recepção -->
            <div id="camposUsuario" class="hidden bg-green-50 p-4 rounded-lg border border-green-200">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-green-900">Unidades Vinculadas</label>
                        <select id="unidades" multiple class="mt-1 block w-full px-4 py-2 border border-green-300 rounded-md h-24 bg-white">
                            <option value="Cotia">Cotia</option>
                            <option value="Barretos">Barretos</option>
                            <option value="Camaragibe">Camaragibe</option>
                            <option value="Campinas">Campinas</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-green-900">Departamentos</label>
                        <select id="departamentos" multiple class="mt-1 block w-full px-4 py-2 border border-green-300 rounded-md h-24 bg-white">
                            <option value="Agendamento">Agendamento</option>
                            <option value="Pós-consulta">Pós-consulta</option>
                            <option value="Financeiro">Recebimentos/Financeiro</option>
                        </select>
                    </div>
                </div>
            </div>

            <button type="button" onclick="montarPayload()" class="w-full bg-indigo-800 text-white py-4 rounded-xl font-bold hover:bg-indigo-900 transition duration-300 shadow-md uppercase">
                Cadastrar Colaborador
            </button>
        </form>
    </div>

    <script>
        // Trava de Segurança Admin
        function validarAcesso() {
            const sessao = localStorage.getItem("teleamei_sessao");
            if (!sessao) { window.location.href = "login.html"; return; }
            const usuarioLogado = JSON.parse(sessao);
            
            if (usuarioLogado.perfil !== "Admin") {
                alert("Acesso restrito. Apenas Administradores podem cadastrar novos usuários.");
                window.location.href = "crm_operacoes.html";
                return;
            }
            document.getElementById('usuarioLogadoNome').innerText = usuarioLogado.nome;
        }

        function fazerLogout() { localStorage.removeItem("teleamei_sessao"); window.location.href = "login.html"; }

        function alternarCampos() {
            const perfil = document.getElementById('perfil').value;
            document.getElementById('camposMedico').classList.add('hidden');
            document.getElementById('camposUsuario').classList.add('hidden');

            if (perfil === 'Medico') document.getElementById('camposMedico').classList.remove('hidden');
            if (perfil === 'Usuario') document.getElementById('camposUsuario').classList.remove('hidden');
        }

        function extrairMultiplos(idCampo) {
            const select = document.getElementById(idCampo);
            if (!select) return [];
            return Array.from(select.selectedOptions).map(opt => opt.value);
        }

        function montarPayload() {
            const btn = document.querySelector('button');
            const textoOriginal = btn.innerText;
            btn.innerText = "Processando e salvando...";
            btn.disabled = true;

            const payload = {
                acao: "criar_usuario",
                nome: document.getElementById('nome').value,
                telefone: document.getElementById('telefone').value,
                email: document.getElementById('email').value,
                senha: document.getElementById('senha').value,
                perfil: document.getElementById('perfil').value,
                crm: document.getElementById('crm') ? document.getElementById('crm').value : "",
                apresentacao: document.getElementById('apresentacao') ? document.getElementById('apresentacao').value : "",
                especialidades: extrairMultiplos('especialidades'),
                unidades: extrairMultiplos('unidades'),
                departamentos: extrairMultiplos('departamentos')
            };

            const url_api = "https://script.google.com/macros/s/AKfycby-1WKshFbFVNfQliUY65_krsep0MnR3HEi6JlYEUG7mSiPVHIwPwRdIlSVnXbVFVQm/exec";

            const fotoInput = document.getElementById('fotoMedico');
            if (payload.perfil === 'Medico' && fotoInput && fotoInput.files.length > 0) {
                const arquivo = fotoInput.files[0];
                const leitor = new FileReader();
                leitor.onload = function(e) {
                    payload.arquivoBase64 = e.target.result.split(',')[1];
                    payload.arquivoMimeType = arquivo.type;
                    payload.arquivoNome = arquivo.name;
                    enviarRequisicao(url_api, payload, btn, textoOriginal);
                };
                leitor.readAsDataURL(arquivo);
            } else {
                enviarRequisicao(url_api, payload, btn, textoOriginal);
            }
        }

        function enviarRequisicao(url, payload, btn, textoOriginal) {
            fetch(url, {
                method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert("✅ Colaborador salvo com sucesso!");
                document.getElementById('formUsuario').reset();
                alternarCampos(); 
            })
            .catch(error => { alert("❌ Falha de conexão."); })
            .finally(() => { btn.innerText = textoOriginal; btn.disabled = false; });
        }

        window.onload = validarAcesso;
    </script>
</body>
</html>
