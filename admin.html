<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prontuário - TeleAmei</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    
    <div class="max-w-6xl mx-auto flex justify-between items-center mb-4 bg-indigo-900 text-white p-4 rounded-lg shadow">
        <div class="font-bold text-lg">TeleAmei 💙 | Ficha do Paciente</div>
        <div class="flex items-center space-x-3">
            <span class="text-sm">Logado como: <strong id="usuarioLogadoNome">Carregando...</strong> (<span id="usuarioLogadoPerfil" class="text-indigo-200"></span>)</span>
            <button id="btnBIAdminNav" onclick="window.location.href='dashboard.html'" class="hidden bg-purple-600 hover:bg-purple-700 px-3 py-1 rounded text-sm font-bold shadow transition">📊 Analytics BI</button>
            <button id="btnDesempenhoNav" onclick="window.location.href='dashboard_operador.html'" class="hidden bg-indigo-600 hover:bg-indigo-700 px-3 py-1 rounded text-sm font-bold shadow transition">Meu Desempenho</button>
            <button onclick="voltarPainel()" class="bg-indigo-500 hover:bg-indigo-600 px-3 py-1 rounded text-sm font-bold shadow transition">Voltar</button>
            <button onclick="fazerLogout()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm font-bold shadow transition">Sair</button>
        </div>
    </div>

    <div class="max-w-6xl mx-auto bg-white p-8 rounded-xl shadow-lg border-t-4 border-blue-800">
        
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-blue-800">Prontuário Eletrônico</h1>
            <div id="botoesOperacao" class="hidden flex space-x-2">
                <button type="button" onclick="dispararWhatsApp('confirmacao')" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded text-sm font-bold shadow">💬 Confirmar Agenda</button>
                <button type="button" onclick="dispararWhatsApp('orcamento')" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded text-sm font-bold shadow">📄 Enviar Orçamento</button>
            </div>
        </div>

        <!-- VISUALIZADOR DE DOCUMENTOS COMPARTILHADO -->
        <div id="divAnexoExistente" class="hidden mb-6 p-4 bg-slate-100 border border-slate-300 rounded-lg shadow-inner">
            <span class="block text-sm text-slate-800 font-bold mb-3">📄 Histórico de Documentos Salvos:</span>
            <div id="listaAnexosExistentes" class="flex flex-wrap gap-2"></div>
        </div>
        
        <form class="space-y-6" id="formAdmin">
            <!-- DADOS BÁSICOS (GERAL) -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 bg-gray-50 p-4 rounded-lg border border-gray-200">
                <div class="col-span-2"><label class="block text-sm font-medium text-gray-700">Paciente</label><input type="text" id="nomePaciente" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md bg-white"></div>
                <div><label class="block text-sm font-medium text-gray-700">Telefone / WhatsApp</label><input type="text" id="telefonePaciente" class="mt-1 block w-full px-4 py-2 border border-green-300 rounded-md bg-white"></div>
                <div><label class="block text-sm font-medium text-gray-700">Especialidade Solicitada</label><input type="text" id="especialidadeAgendada" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md bg-white"></div>
                
                <div class="col-span-4 bg-indigo-50 p-4 rounded-lg border border-indigo-200 mt-2 grid grid-cols-4 gap-4 items-end">
                    <div><label class="block text-sm font-bold text-indigo-900">Data da Consulta</label><input type="date" id="dataAgendada" class="mt-1 block w-full px-4 py-2 border border-indigo-300 rounded-md"></div>
                    <div><label class="block text-sm font-bold text-indigo-900">Hora da Consulta</label><input type="time" id="horaAgendada" class="mt-1 block w-full px-4 py-2 border border-indigo-300 rounded-md"></div>
                    <div>
                        <label class="block text-sm font-bold text-indigo-900">Médico Responsável</label>
                        <select id="medicoResponsavel" class="mt-1 block w-full px-4 py-2 border border-indigo-300 rounded-md bg-white"><option value="">Selecione...</option></select>
                    </div>
                    <div><label class="block text-sm font-bold text-indigo-900">Link Google Meet</label><input type="url" id="linkMeet" placeholder="https://meet.google.com/..." class="mt-1 block w-full px-4 py-2 border border-indigo-300 rounded-md"></div>
                </div>
            </div>

            <!-- BLOCO OPERAÇÃO: STATUS E FINANCEIRO -->
            <div id="blocoPreConsulta" class="hidden grid grid-cols-3 gap-4">
                <div><label class="block text-sm font-medium text-gray-700">Valor da Consulta (R$)</label><input type="number" id="valorConsulta" oninput="sincronizarFinanceiro()" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md"></div>
                <div class="bg-blue-50 p-2 rounded-lg border border-blue-200">
                    <label class="block text-sm font-bold text-blue-900 mb-2">Fase do Atendimento</label>
                    <select id="statusOperacao" onchange="verificarRegras()" class="block w-full px-4 py-2 border border-blue-300 rounded-md bg-white font-bold">
                        <option value="Aguardando agendamento">Aguardando agendamento</option>
                        <option value="Agendado">Agendado</option>
                        <option value="Aguardando orçamento dos exames">Aguardando orçamento dos exames</option>
                        <option value="Exames Agendados">Exames Agendados</option>
                        <option value="Concluído">Concluído</option>
                    </select>
                </div>
                <div><label class="block text-sm font-medium text-gray-700">Anexar Documento (Recepção)</label><input type="file" id="anexoRecepcao" class="mt-1 block w-full bg-white p-2 border border-gray-300 rounded text-xs"></div>
            </div>

            <!-- BLOCO OPERAÇÃO: ORÇAMENTO EXAMES -->
            <div id="blocoOrcamento" class="hidden bg-yellow-50 p-6 rounded-lg border-2 border-yellow-400 mt-6 shadow-sm">
                <h3 class="text-lg font-bold text-yellow-900 mb-4">📄 Orçamento e Agendamento de Exames</h3>
                <div class="grid grid-cols-2 gap-6">
                    <div><label class="block text-sm font-bold text-gray-800">Valor TOTAL dos Exames (R$)</label><input type="number" id="orcamentoTotal" oninput="verificarAlertaOrcamento(); sincronizarFinanceiro();" class="mt-1 block w-full px-4 py-3 border border-yellow-400 bg-white rounded-md text-lg font-bold"></div>
                    <div><label class="block text-sm font-bold text-gray-800">CUSTO dos Exames (R$)</label><input type="number" id="orcamentoCusto" oninput="verificarAlertaOrcamento(); sincronizarFinanceiro();" class="mt-1 block w-full px-4 py-3 border border-yellow-400 bg-white rounded-md text-lg font-bold"></div>
                </div>
                <div id="campoDataExame" class="hidden mt-6 bg-white p-4 border border-green-300 rounded-lg">
                    <label class="block text-sm font-bold text-green-900">Data Agendada para os Exames</label>
                    <input type="date" id="dataExame" class="mt-2 block w-full md:w-1/3 px-4 py-2 border border-green-400 rounded-md shadow-sm">
                </div>
            </div>

            <!-- BLOCO MÉDICO: PRONTUÁRIO E ANEXOS -->
            <div id="blocoMedico" class="hidden border-t-2 border-blue-200 pt-6">
                <div class="bg-blue-50 p-6 rounded-xl border border-blue-300">
                    <h3 class="text-xl font-bold text-blue-900 mb-4">🩺 Prontuário Médico</h3>
                    
                    <label class="block text-sm font-bold text-blue-900 mb-2">A consulta foi realizada? <span class="text-red-500">*</span></label>
                    <select id="statusMedico" onchange="verificarRegras()" class="block w-full md:w-1/3 px-4 py-2 border border-blue-400 rounded-md bg-white mb-6">
                        <option value="">Selecione obrigatoriamente...</option>
                        <option value="sim">Sim, consulta realizada</option>
                        <option value="nao">Não realizada (Falta/Erro)</option>
                    </select>

                    <div id="blocoAnexosMedico" class="hidden bg-white p-5 rounded-lg border border-blue-200 shadow-sm">
                        <label class="block text-sm font-bold text-indigo-900 mb-4 border-b pb-2">Houve emissão de documentos? Anexe nas categorias abaixo:</label>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="bg-slate-50 p-3 rounded border"><label class="block text-xs font-bold text-slate-700">Atestado Médico</label><input type="file" id="anexoAtestado" class="mt-2 w-full text-xs cursor-pointer"></div>
                            <div class="bg-yellow-50 p-3 rounded border border-yellow-200"><label class="block text-xs font-bold text-yellow-800">Solicitação de Exames</label><input type="file" id="anexoSolExames" class="mt-2 w-full text-xs cursor-pointer"></div>
                            <div class="bg-slate-50 p-3 rounded border"><label class="block text-xs font-bold text-slate-700">Encaminhamento</label><input type="file" id="anexoEncaminhamento" class="mt-2 w-full text-xs cursor-pointer"></div>
                            <div class="bg-slate-50 p-3 rounded border"><label class="block text-xs font-bold text-slate-700">Receita</label><input type="file" id="anexoReceita" class="mt-2 w-full text-xs cursor-pointer"></div>
                            <div class="bg-slate-50 p-3 rounded border md:col-span-2"><label class="block text-xs font-bold text-slate-700">Outros</label><input type="file" id="anexoOutros" class="mt-2 w-full text-xs cursor-pointer"></div>
                        </div>
                    </div>
                </div>
            </div>

            <button type="button" id="btnSalvar" onclick="salvarDados()" class="w-full bg-blue-800 text-white py-4 rounded-xl font-bold hover:bg-blue-900 transition duration-300 mt-8 shadow-lg text-lg uppercase">
                Gravar Prontuário
            </button>
        </form>
    </div>

    <script>
        const URL_API = "https://script.google.com/macros/s/AKfycby-1WKshFbFVNfQliUY65_krsep0MnR3HEi6JlYEUG7mSiPVHIwPwRdIlSVnXbVFVQm/exec";
        let usuarioLogado = null; let idEdicao = null; let linkAnexoExistente = ""; let alertaDisparado = false;

        function validarAcesso() {
            const sessao = localStorage.getItem("teleamei_sessao");
            if (!sessao) { window.location.href = "login.html"; return; }
            usuarioLogado = JSON.parse(sessao);
            
            document.getElementById('usuarioLogadoNome').innerText = usuarioLogado.nome;
            document.getElementById('usuarioLogadoPerfil').innerText = usuarioLogado.perfil;
            
            if (usuarioLogado.perfil === "Medico") {
                document.getElementById('blocoMedico').classList.remove('hidden');
            } else {
                document.getElementById('botoesOperacao').classList.remove('hidden');
                document.getElementById('blocoPreConsulta').classList.remove('hidden');
            }
            carregarMedicos(); verificarModoEdicao();
        }

        function fazerLogout() { localStorage.removeItem("teleamei_sessao"); window.location.href = "login.html"; }
        function voltarPainel() { window.location.href = usuarioLogado.perfil === "Medico" ? "painel_medico.html" : "crm_operacoes.html"; }

        function carregarMedicos() {
            fetch(URL_API + "?acao=listar_medicos").then(res => res.json()).then(retorno => {
                if (retorno.status === "sucesso") {
                    const select = document.getElementById('medicoResponsavel');
                    retorno.dados.forEach(m => {
                        const op = document.createElement('option'); op.value = m.nome; op.innerText = m.nome;
                        select.appendChild(op);
                    });
                }
            });
        }

        function verificarModoEdicao() {
            idEdicao = new URLSearchParams(window.location.search).get('id');
            if (idEdicao) {
                fetch(URL_API).then(res => res.json()).then(res => {
                    if (res.status === "sucesso") {
                        const registro = res.dados.find(r => (r.ID || r.id) === idEdicao);
                        if (registro) preencherFormulario(registro);
                    }
                });
            }
        }

        function preencherFormulario(dados) {
            document.getElementById('nomePaciente').value = dados.Paciente || "";
            document.getElementById('telefonePaciente').value = dados.Telefone || "";
            document.getElementById('especialidadeAgendada').value = dados.Especialidade || "";
            document.getElementById('dataAgendada').value = dados.Data_Agendada || "";
            document.getElementById('horaAgendada').value = dados.Hora_Agendada || "";
            document.getElementById('linkMeet').value = dados.Link_Meet || "";
            document.getElementById('valorConsulta').value = dados.Valor_Consulta || "";
            document.getElementById('orcamentoTotal').value = dados.Total_Exames || "";
            document.getElementById('orcamentoCusto').value = dados.Custo_Exames || "";
            
            const statusAtual = dados.Status_Consulta || "Aguardando agendamento";
            document.getElementById('statusOperacao').value = statusAtual;
            
            if (statusAtual === "sim" || statusAtual === "nao") {
                document.getElementById('statusMedico').value = statusAtual;
            }

            linkAnexoExistente = dados.Link_Anexo || "";
            if (linkAnexoExistente && linkAnexoExistente !== "Sem anexo") {
                document.getElementById('divAnexoExistente').classList.remove('hidden');
                let links = linkAnexoExistente.split(" | ");
                links.forEach((url, i) => {
                    document.getElementById('listaAnexosExistentes').innerHTML += `<a href="${url.trim()}" target="_blank" class="bg-indigo-100 text-indigo-800 px-3 py-1 rounded text-xs font-bold shadow-sm hover:bg-indigo-200">📄 Ver Documento ${i+1}</a>`;
                });
            }

            setTimeout(() => { document.getElementById('medicoResponsavel').value = dados.Medico_Responsavel || ""; }, 500);
            verificarRegras();
        }

        function verificarRegras() {
            // Regra Médico
            if (usuarioLogado.perfil === "Medico") {
                if (document.getElementById('statusMedico').value === "sim") {
                    document.getElementById('blocoAnexosMedico').classList.remove('hidden');
                } else {
                    document.getElementById('blocoAnexosMedico').classList.add('hidden');
                }
            }
            // Regra Operação
            else {
                const status = document.getElementById('statusOperacao').value;
                if (status === "Aguardando orçamento dos exames" || status === "Exames Agendados") {
                    document.getElementById('blocoOrcamento').classList.remove('hidden');
                } else {
                    document.getElementById('blocoOrcamento').classList.add('hidden');
                }
            }
        }

        function verificarAlertaOrcamento() {
            const total = parseFloat(document.getElementById('orcamentoTotal').value) || 0;
            const custo = parseFloat(document.getElementById('orcamentoCusto').value) || 0;
            if (total > 0 && custo > 0) {
                document.getElementById('campoDataExame').classList.remove('hidden');
                if (!alertaDisparado) {
                    alert("⚠️ Lembrete: Orçamento preenchido com sucesso! Envie o orçamento ao cliente e insira a data agendada para os exames no campo liberado abaixo.");
                    alertaDisparado = true;
                }
            } else {
                document.getElementById('campoDataExame').classList.add('hidden');
            }
        }
        function sincronizarFinanceiro() { /* Cálculo de comissões mantém-se no backend ou BI */ }

        function salvarDados() {
            let statusFinal = usuarioLogado.perfil === "Medico" ? document.getElementById('statusMedico').value : document.getElementById('statusOperacao').value;
            const dataConsulta = document.getElementById('dataAgendada').value;
            const horaConsulta = document.getElementById('horaAgendada').value;
            const linkMeet = document.getElementById('linkMeet').value;

            if (usuarioLogado.perfil === "Medico" && !statusFinal) {
                alert("❌ Obrigatório informar se a consulta foi realizada."); return;
            }

            if ((dataConsulta || horaConsulta) && !linkMeet) {
                alert("⚠️ O Link do Google Meet é obrigatório quando a data e hora estão preenchidas."); return;
            }

            // Automações de Status
            if (statusFinal === "Aguardando agendamento" && dataConsulta && horaConsulta && linkMeet) statusFinal = "Agendado";
            if (usuarioLogado.perfil === "Medico" && document.getElementById('anexoSolExames').files.length > 0) statusFinal = "Aguardando orçamento dos exames";

            const payload = {
                paciente: document.getElementById('nomePaciente').value,
                especialidade: document.getElementById('especialidadeAgendada').value,
                medicoResponsavel: document.getElementById('medicoResponsavel').value,
                dataAgendada: dataConsulta, horaAgendada: horaConsulta, linkMeet: linkMeet,
                valorConsulta: parseFloat(document.getElementById('valorConsulta').value) || 0,
                totalExames: parseFloat(document.getElementById('orcamentoTotal').value) || 0,
                custoExames: parseFloat(document.getElementById('orcamentoCusto').value) || 0,
                statusConsulta: statusFinal,
                linkAnexoExistente: linkAnexoExistente,
                operadorResponsavel: usuarioLogado.nome
            };
            if (idEdicao) { payload.acao = "atualizar_registro"; payload.id_registro = idEdicao; }

            const btn = document.getElementById('btnSalvar');
            btn.innerText = "Processando e Salvando..."; btn.disabled = true;

            // Leitura assíncrona de múltiplos arquivos
            let promessas = [];
            const tiposAnexos = [
                { id: 'anexoAtestado', tipo: 'Atestado' }, { id: 'anexoSolExames', tipo: 'Sol. Exames' },
                { id: 'anexoEncaminhamento', tipo: 'Encaminhamento' }, { id: 'anexoReceita', tipo: 'Receita' },
                { id: 'anexoOutros', tipo: 'Outros (Médico)' }, { id: 'anexoRecepcao', tipo: 'Recepção' }
            ];

            tiposAnexos.forEach(item => {
                const el = document.getElementById(item.id);
                if (el && el.files.length > 0) {
                    Array.from(el.files).forEach(file => {
                        promessas.push(new Promise((resolve) => {
                            let reader = new FileReader();
                            reader.onload = e => resolve({ base64: e.target.result.split(',')[1], mimeType: file.type, nome: `${item.tipo} - ${file.name}` });
                            reader.readAsDataURL(file);
                        }));
                    });
                }
            });

            Promise.all(promessas).then(arquivosLidos => {
                if (arquivosLidos.length > 0) payload.arquivos = arquivosLidos;
                
                fetch(URL_API, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
                .then(() => { alert("✅ Prontuário atualizado!"); voltarPainel(); })
                .finally(() => { btn.innerText = "Gravar Prontuário"; btn.disabled = false; });
            });
        }
        window.onload = validarAcesso;
    </script>
</body>
</html>
