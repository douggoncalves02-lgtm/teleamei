<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prontuário - TeleAmei</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">
    
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 mb-4 bg-indigo-900 text-white p-4 rounded-lg shadow">
        <div class="font-bold text-lg text-center md:text-left">TeleAmei 💙 | Ficha do Paciente</div>
        <div class="flex flex-wrap justify-center items-center gap-2 md:gap-3">
            <span class="text-sm w-full md:w-auto text-center md:text-left mb-2 md:mb-0">Logado como: <strong id="usuarioLogadoNome">Carregando...</strong></span>
            <button id="btnBIAdminNav" onclick="window.location.href='dashboard.html'" class="hidden bg-purple-600 hover:bg-purple-700 px-3 py-2 md:py-1 rounded text-sm font-bold shadow transition w-full md:w-auto">📊 Analytics BI</button>
            <button id="btnDesempenhoNav" onclick="window.location.href='dashboard_operador.html'" class="hidden bg-indigo-600 hover:bg-indigo-700 px-3 py-2 md:py-1 rounded text-sm font-bold shadow transition w-full md:w-auto">Meu Desempenho</button>
            <button onclick="voltarPainel()" class="bg-indigo-500 hover:bg-indigo-600 px-3 py-2 md:py-1 rounded text-sm font-bold shadow transition w-full md:w-auto">Voltar</button>
            <button onclick="fazerLogout()" class="bg-red-500 hover:bg-red-600 px-3 py-2 md:py-1 rounded text-sm font-bold shadow transition w-full md:w-auto">Sair</button>
        </div>
    </div>

    <div class="max-w-6xl mx-auto bg-white p-4 md:p-8 rounded-xl shadow-lg border-t-4 border-blue-800">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
            <h1 class="text-xl md:text-2xl font-bold text-blue-800 text-center md:text-left w-full md:w-auto">Prontuário Eletrônico</h1>
            <div id="botoesOperacao" class="hidden flex flex-wrap justify-center gap-2 w-full md:w-auto">
                <button type="button" onclick="dispararWhatsApp('confirmacao')" class="w-full md:w-auto bg-green-500 hover:bg-green-600 text-white px-4 py-3 md:py-2 rounded text-sm font-bold shadow">💬 Confirmar Agenda</button>
                <button type="button" onclick="dispararWhatsApp('orcamento')" class="w-full md:w-auto bg-teal-600 hover:bg-teal-700 text-white px-4 py-3 md:py-2 rounded text-sm font-bold shadow">📄 Enviar Orçamento</button>
            </div>
            <div id="botoesMedico" class="hidden flex space-x-2">
                <button type="button" onclick="dispararWhatsApp('documentos')" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 md:py-2 rounded text-sm font-bold shadow transition flex items-center justify-center">🩺 Enviar Documentos</button>
            </div>
        </div>

        <div id="divAnexoExistente" class="hidden mb-6 p-4 bg-slate-100 border border-slate-300 rounded-lg shadow-inner">
            <span class="block text-sm text-slate-800 font-bold mb-3">📄 Histórico de Documentos Salvos:</span>
            <div id="listaAnexosExistentes" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
        </div>
        
        <form class="space-y-6" id="formAdmin">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 bg-gray-50 p-4 rounded-lg border border-gray-200">
                <div class="md:col-span-2"><label class="block text-sm font-medium text-gray-700">Paciente</label><input type="text" id="nomePaciente" class="mt-1 block w-full px-4 py-3 md:py-2 border border-gray-300 rounded-md bg-white"></div>
                <div><label class="block text-sm font-medium text-gray-700">Telefone / WhatsApp</label><input type="text" id="telefonePaciente" class="mt-1 block w-full px-4 py-3 md:py-2 border border-green-300 rounded-md bg-white"></div>
                <div><label class="block text-sm font-medium text-gray-700">Especialidade Solicitada</label><input type="text" id="especialidadeAgendada" class="mt-1 block w-full px-4 py-3 md:py-2 border border-gray-300 rounded-md bg-white"></div>
                
                <div class="col-span-1 md:col-span-2 lg:col-span-4 bg-indigo-50 p-4 rounded-lg border border-indigo-200 mt-2 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 items-end">
                    <div><label class="block text-sm font-bold text-indigo-900">Data da Consulta</label><input type="date" id="dataAgendada" class="mt-1 block w-full px-4 py-3 md:py-2 border border-indigo-300 rounded-md"></div>
                    <div><label class="block text-sm font-bold text-indigo-900">Hora da Consulta</label><input type="time" id="horaAgendada" class="mt-1 block w-full px-4 py-3 md:py-2 border border-indigo-300 rounded-md"></div>
                    <div>
                        <label class="block text-sm font-bold text-indigo-900">Médico Responsável</label>
                        <select id="medicoResponsavel" class="mt-1 block w-full px-4 py-3 md:py-2 border border-indigo-300 rounded-md bg-white"><option value="">Carregando...</option></select>
                    </div>
                    <div><label class="block text-sm font-bold text-indigo-900">Link Google Meet</label><input type="url" id="linkMeet" class="mt-1 block w-full px-4 py-3 md:py-2 border border-indigo-300 rounded-md"></div>
                </div>

                <div class="col-span-1 md:col-span-2 lg:col-span-4">
                    <label class="block text-sm font-medium text-gray-700">Unidade de Atendimento</label>
                    <select id="unidadeAtendimento" class="mt-1 block w-full px-4 py-3 md:py-2 border border-gray-300 rounded-md md:w-1/3 bg-white"><option value="">Carregando...</option></select>
                </div>
            </div>

            <div id="blocoPreConsulta" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4">
                <div><label class="block text-sm font-medium text-gray-700">Valor da Consulta (R$)</label><input type="number" id="valorConsulta" class="mt-1 block w-full px-4 py-3 md:py-2 border border-gray-300 rounded-md"></div>
                <div class="bg-blue-50 p-3 rounded-lg border border-blue-200">
                    <label class="block text-sm font-bold text-blue-900 mb-2">Fase do Atendimento</label>
                    <select id="statusOperacao" onchange="verificarRegras()" class="block w-full px-4 py-3 md:py-2 border border-blue-300 rounded-md bg-white font-bold">
                        <option value="Aguardando agendamento">Aguardando agendamento</option>
                        <option value="Agendado">Agendado</option>
                        <option value="Aguardando orçamento dos exames">Aguardando orçamentos</option>
                        <option value="Exames Agendados">Exames Agendados</option>
                        <option value="Concluído">Concluído</option>
                    </select>
                </div>
                <div><label class="block text-sm font-medium text-gray-700">Anexar Doc (Recepção)</label><input type="file" id="anexoRecepcao" class="mt-1 block w-full bg-white p-2 border border-gray-300 rounded text-sm md:text-xs"></div>
            </div>

            <div id="blocoOrcamento" class="hidden bg-yellow-50 p-4 md:p-6 rounded-lg border-2 border-yellow-400 mt-6 shadow-sm">
                <h3 class="text-lg font-bold text-yellow-900 mb-4">📄 Orçamento e Exames</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                    <div><label class="block text-sm font-bold text-gray-800">Valor TOTAL (R$)</label><input type="number" id="orcamentoTotal" oninput="verificarAlertaOrcamento()" class="mt-1 block w-full px-4 py-3 border border-yellow-400 bg-white rounded-md font-bold"></div>
                    <div><label class="block text-sm font-bold text-gray-800">CUSTO (R$)</label><input type="number" id="orcamentoCusto" oninput="verificarAlertaOrcamento()" class="mt-1 block w-full px-4 py-3 border border-yellow-400 bg-white rounded-md font-bold"></div>
                </div>
                <div id="campoDataExame" class="hidden mt-6 bg-white p-4 border border-green-300 rounded-lg">
                    <label class="block text-sm font-bold text-green-900">Data Agendada para os Exames</label>
                    <input type="date" id="dataExame" class="mt-2 block w-full md:w-1/3 px-4 py-3 md:py-2 border border-green-400 rounded-md">
                </div>
            </div>

            <div id="blocoMedico" class="hidden border-t-2 border-blue-200 pt-6">
                <div class="bg-blue-50 p-4 md:p-6 rounded-xl border border-blue-300">
                    <h3 class="text-xl font-bold text-blue-900 mb-4">🩺 Prontuário Médico</h3>
                    <label class="block text-sm font-bold text-blue-900 mb-2">A consulta foi realizada? <span class="text-red-500">*</span></label>
                    <select id="statusMedico" onchange="verificarRegras()" class="block w-full md:w-1/3 px-4 py-3 md:py-2 border border-blue-400 rounded-md bg-white mb-6">
                        <option value="">Selecione obrigatoriamente...</option><option value="sim">Sim, consulta realizada</option><option value="nao">Não realizada</option>
                    </select>
                    <div id="blocoAnexosMedico" class="hidden bg-white p-4 md:p-5 rounded-lg border border-blue-200 shadow-sm">
                        <label class="block text-sm font-bold text-indigo-900 mb-4 border-b pb-2">Emissão de documentos:</label>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                            <div class="bg-slate-50 p-3 rounded border"><label class="block text-xs font-bold">Atestado</label><input type="file" id="anexoAtestado" class="mt-2 w-full text-xs cursor-pointer"></div>
                            <div class="bg-yellow-50 p-3 rounded border border-yellow-200"><label class="block text-xs font-bold text-yellow-800">Sol. Exames</label><input type="file" id="anexoSolExames" class="mt-2 w-full text-xs cursor-pointer"></div>
                            <div class="bg-slate-50 p-3 rounded border"><label class="block text-xs font-bold">Encaminhamento</label><input type="file" id="anexoEncaminhamento" class="mt-2 w-full text-xs cursor-pointer"></div>
                            <div class="bg-slate-50 p-3 rounded border"><label class="block text-xs font-bold">Receita/Outros</label><input type="file" id="anexoOutros" class="mt-2 w-full text-xs cursor-pointer"></div>
                        </div>
                    </div>
                </div>
            </div>

            <button type="button" id="btnSalvar" onclick="salvarDados()" class="w-full bg-blue-800 text-white py-4 rounded-xl font-bold hover:bg-blue-900 transition shadow-lg text-lg uppercase mt-8">Gravar Prontuário</button>
        </form>
    </div>

    <script>
        const URL_API = "https://script.google.com/macros/s/AKfycby-1WKshFbFVNfQliUY65_krsep0MnR3HEi6JlYEUG7mSiPVHIwPwRdIlSVnXbVFVQm/exec";
        let usuarioLogado = null; let idEdicao = null; let anexosGlobais = [];

        function higienizarData(val) {
            if (!val) return ""; let s = String(val).trim(); if (s.includes("1899") || s.includes("1900")) return ""; 
            if (s.includes("T")) { let d = new Date(s); if (!isNaN(d)) return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
            if (s.includes("/")) { let p = s.split('/'); if (p.length === 3) return `${p[2]}-${p[1]}-${p[0]}`; } return s.substring(0, 10);
        }
        function higienizarHora(val) {
            if (!val) return ""; let s = String(val).trim(); if (/^\d{2}:\d{2}/.test(s)) return s.substring(0, 5);
            if (s.includes("T")) { let d = new Date(s); if (!isNaN(d)) return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); } return s.substring(0, 5);
        }
        function lerValor(obj, chaves) {
            const norm = {}; for (let k in obj) norm[k.toLowerCase().trim()] = obj[k];
            for (let c of chaves) if (norm[c] !== undefined && norm[c] !== null && norm[c] !== "") return norm[c]; return "";
        }

        const OmnichannelService = {
            executarEnvio: function(telefone, mensagem) {
                const numeroLimpo = telefone.replace(/\D/g, ''); if (numeroLimpo.length < 10) return alert("Número inválido.");
                window.open(`https://wa.me/55${numeroLimpo}?text=${encodeURIComponent(mensagem)}`, '_blank');
            }
        };

        function dispararWhatsApp(tipo) {
            const tel = document.getElementById('telefonePaciente').value; const pac = document.getElementById('nomePaciente').value || "Paciente"; const med = document.getElementById('medicoResponsavel').value || "médico";
            if (!tel) return alert("Preencha o Telefone.");
            let msg = "";
            if (tipo === 'confirmacao') msg = `Olá ${pac}!\nPassando para confirmar sua consulta com Dr(a). ${med} na unidade ${document.getElementById('unidadeAtendimento').value}.\nResponda SIM para confirmar.`;
            else if (tipo === 'orcamento') msg = `Olá ${pac}!\nSeu orçamento de exames está pronto. Valor total: R$ ${document.getElementById('orcamentoTotal').value}.\nComo prefere realizar o pagamento?`;
            else if (tipo === 'documentos') {
                const ativos = anexosGlobais.filter(a => a.status === 'ativo'); if (ativos.length === 0) return alert("Nenhum doc salvo.");
                let links = ""; ativos.forEach(tag => links += `\n📄 *${tag.nome.split(' - ')[0]}*:\n${tag.url}\n`);
                msg = `Olá ${pac}!\nConforme sua consulta com Dr(a). ${med}, acesse seus documentos:\n${links}\n\nQualquer dúvida, estamos à disposição!`;
            }
            OmnichannelService.executarEnvio(tel, msg);
        }

        function validarAcesso() {
            const sessaoStr = localStorage.getItem("teleamei_sessao");
            if (!sessaoStr) { window.location.href = "login.html"; return; }
            const sessao = JSON.parse(sessaoStr);
            const limiteHoras = 24 * 60 * 60 * 1000; 
            if (!sessao.timestamp || (Date.now() - sessao.timestamp > limiteHoras)) {
                localStorage.removeItem("teleamei_sessao"); alert("Sessão expirada por segurança (24h). Faça login novamente."); window.location.href = "login.html"; return;
            }
            usuarioLogado = sessao; document.getElementById('usuarioLogadoNome').innerText = usuarioLogado.nome;
            if (usuarioLogado.perfil === "Admin") { document.getElementById('btnBIAdminNav').classList.remove('hidden'); document.getElementById('btnDesempenhoNav').classList.remove('hidden'); } 
            else if (usuarioLogado.perfil !== "Medico") document.getElementById('btnDesempenhoNav').classList.remove('hidden');
            if (usuarioLogado.perfil === "Medico") document.getElementById('blocoMedico').classList.remove('hidden');
            else { document.getElementById('botoesOperacao').classList.remove('hidden'); document.getElementById('blocoPreConsulta').classList.remove('hidden'); document.getElementById('botoesMedico').classList.remove('hidden'); }
            carregarDadosDinamicos(); verificarModoEdicao();
        }

        function fazerLogout() { localStorage.removeItem("teleamei_sessao"); window.location.href = "login.html"; }
        function voltarPainel() { window.location.href = usuarioLogado.perfil === "Medico" ? "painel_medico.html" : "crm_operacoes.html"; }

        function carregarDadosDinamicos() {
            fetch(URL_API + "?acao=listar_usuarios").then(res => res.json()).then(retorno => {
                if (retorno.status === "sucesso") {
                    const sMed = document.getElementById('medicoResponsavel'); const sUnd = document.getElementById('unidadeAtendimento');
                    sMed.innerHTML = '<option value="">Selecione o Médico...</option>'; sUnd.innerHTML = '<option value="">Selecione a Unidade...</option>';
                    const setUnd = new Set(['Barretos', 'Cotia', 'Campinas', 'Camaragibe', 'Campinas Sudoeste']);
                    retorno.dados.forEach(u => {
                        const unds = u.Unidades_Vinculadas || u.unidades || ""; if (unds) unds.split(',').forEach(un => { if (un.trim() !== "") setUnd.add(un.trim()); });
                        if (String(u.Perfil || u.perfil).toLowerCase() === "medico" && String(u.Status || u.status).toLowerCase() === "ativo") {
                            const nome = u.Nome_Completo || u.nome || ""; if (nome) { const op = document.createElement('option'); op.value = nome; op.innerText = nome; sMed.appendChild(op); }
                        }
                    });
                    Array.from(setUnd).sort().forEach(un => { const op = document.createElement('option'); op.value = un; op.innerText = un; sUnd.appendChild(op); });
                }
            });
        }

        function verificarModoEdicao() {
            idEdicao = new URLSearchParams(window.location.search).get('id');
            if (idEdicao) fetch(URL_API).then(res => res.json()).then(res => { if (res.status === "sucesso") { const reg = res.dados.find(r => (r.ID || r.id) === idEdicao); if (reg) preencherFormulario(reg); } });
        }

        function preencherFormulario(dados) {
            document.getElementById('nomePaciente').value = lerValor(dados, ['paciente', 'nome_paciente']);
            document.getElementById('telefonePaciente').value = lerValor(dados, ['telefone', 'whatsapp']);
            document.getElementById('especialidadeAgendada').value = lerValor(dados, ['especialidade', 'especialidade_solicitada']);
            document.getElementById('dataAgendada').value = higienizarData(lerValor(dados, ['data_agendada', 'data agendada', 'data']));
            document.getElementById('horaAgendada').value = higienizarHora(lerValor(dados, ['hora_agendada', 'hora agendada', 'hora']));
            document.getElementById('dataExame').value = higienizarData(lerValor(dados, ['data_exame', 'data exame']));
            document.getElementById('linkMeet').value = lerValor(dados, ['link_meet', 'meet']);
            document.getElementById('valorConsulta').value = lerValor(dados, ['valor_consulta', 'valor']);
            document.getElementById('orcamentoTotal').value = lerValor(dados, ['total_exames', 'exames']);
            document.getElementById('orcamentoCusto').value = lerValor(dados, ['custo_exames', 'custo']);
            
            const sm = lerValor(dados, ['status_medico']); if(sm) document.getElementById('statusMedico').value = sm;
            document.getElementById('statusOperacao').value = lerValor(dados, ['status_consulta', 'status']) || "Aguardando agendamento";

            const ax = lerValor(dados, ['link_anexo', 'anexo']); anexosGlobais = [];
            if (ax && ax !== "Sem anexo") { try { anexosGlobais = JSON.parse(ax); } catch(e) { ax.split(" | ").forEach((url, i) => { if(url.trim() !== "") anexosGlobais.push({ url: url.trim(), nome: `Doc Legado ${i+1}`, status: 'ativo' }); }); } }
            renderizarAnexos();

            setTimeout(() => { 
                const md = lerValor(dados, ['medico_responsavel', 'medico']); const un = lerValor(dados, ['unidade', 'unidade_atendimento']);
                if (md) document.getElementById('medicoResponsavel').value = md; if (un) document.getElementById('unidadeAtendimento').value = un; 
            }, 800);
            verificarRegras();
        }

        function renderizarAnexos() {
            const div = document.getElementById('divAnexoExistente'); const lista = document.getElementById('listaAnexosExistentes'); lista.innerHTML = "";
            if (anexosGlobais.length === 0) { div.classList.add('hidden'); return; } div.classList.remove('hidden');
            anexosGlobais.forEach((a, i) => {
                let bg = a.status === 'ativo' ? 'bg-white' : 'bg-gray-100 opacity-70'; let sc = a.status === 'ativo' ? '' : 'line-through';
                let bt = a.status === 'ativo' ? (usuarioLogado.perfil === 'Admin' ? `<button type="button" onclick="alterarStatusAnexo(${i}, 'excluido')" class="text-xs text-red-600 font-bold hover:underline">❌ Excluir</button>` : `<button type="button" onclick="alterarStatusAnexo(${i}, 'substituido')" class="text-xs text-orange-600 font-bold hover:underline">🔄 Substituir</button>`) : '';
                lista.innerHTML += `<div class="flex items-center justify-between p-3 rounded border ${bg}"><a href="${a.url}" target="_blank" class="text-indigo-800 font-bold text-xs ${sc}">📄 ${a.nome}</a><div>${bt}</div></div>`;
            });
        }
        function alterarStatusAnexo(i, st) { if(confirm("Confirmar alteração de status deste documento?")) { anexosGlobais[i].status = st; renderizarAnexos(); } }

        function verificarRegras() {
            if (usuarioLogado.perfil === "Medico") { document.getElementById('blocoAnexosMedico').classList.toggle('hidden', document.getElementById('statusMedico').value !== "sim"); } 
            else { const st = document.getElementById('statusOperacao').value; document.getElementById('blocoOrcamento').classList.toggle('hidden', !(st === "Aguardando orçamento dos exames" || st === "Exames Agendados")); }
        }
        function verificarAlertaOrcamento() { document.getElementById('campoDataExame').classList.toggle('hidden', !(parseFloat(document.getElementById('orcamentoTotal').value)>0 && parseFloat(document.getElementById('orcamentoCusto').value)>0)); }

        function salvarDados() {
            let stOp = document.getElementById('statusOperacao').value; let stMd = document.getElementById('statusMedico').value;
            const dt = document.getElementById('dataAgendada').value; const hr = document.getElementById('horaAgendada').value; const mt = document.getElementById('linkMeet').value;
            if (usuarioLogado.perfil === "Medico" && !stMd) return alert("❌ Informe se a consulta foi realizada.");
            if ((dt || hr) && !mt) return alert("⚠️ Link do Google Meet é obrigatório ao definir data/hora.");
            if (stOp === "Aguardando agendamento" && dt && hr && mt) stOp = "Agendado";
            if (usuarioLogado.perfil === "Medico" && stMd === "sim") stOp = "Concluído";

            const py = {
                paciente: document.getElementById('nomePaciente').value, telefone: document.getElementById('telefonePaciente').value, especialidade: document.getElementById('especialidadeAgendada').value, medicoResponsavel: document.getElementById('medicoResponsavel').value,
                unidade: document.getElementById('unidadeAtendimento').value, dataAgendada: dt, horaAgendada: hr, linkMeet: mt, valorConsulta: parseFloat(document.getElementById('valorConsulta').value) || 0, totalExames: parseFloat(document.getElementById('orcamentoTotal').value) || 0,
                custoExames: parseFloat(document.getElementById('orcamentoCusto').value) || 0, dataExame: document.getElementById('dataExame').value, statusConsulta: stOp, statusMedico: stMd, anexosAtuais: anexosGlobais, operadorResponsavel: usuarioLogado.nome
            };
            if (idEdicao) { py.acao = "atualizar_registro"; py.id_registro = idEdicao; }
            const btn = document.getElementById('btnSalvar'); btn.innerText = "Salvando..."; btn.disabled = true;

            let prom = []; const tps = [{ id: 'anexoAtestado', tipo: 'Atestado' }, { id: 'anexoSolExames', tipo: 'Sol. Exames' }, { id: 'anexoEncaminhamento', tipo: 'Encaminhamento' }, { id: 'anexoOutros', tipo: 'Receita/Outros' }, { id: 'anexoRecepcao', tipo: 'Recepção' }];
            tps.forEach(it => {
                const el = document.getElementById(it.id);
                if (el && el.files.length > 0) { Array.from(el.files).forEach(f => prom.push(new Promise(r => { let rd = new FileReader(); rd.onload = e => r({ base64: e.target.result.split(',')[1], mimeType: f.type, nome: `${it.tipo} - ${f.name}` }); rd.readAsDataURL(f); }))); }
            });
            Promise.all(prom).then(arqs => {
                if (arqs.length > 0) py.arquivos = arqs;
                fetch(URL_API, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(py) }).then(() => { alert("✅ Prontuário salvo!"); voltarPainel(); }).finally(() => { btn.innerText = "Gravar Prontuário"; btn.disabled = false; });
            });
        }
        window.onload = validarAcesso;
    </script>
</body>
</html>
